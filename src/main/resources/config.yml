# ==========================================================
# MDVQuest 1.2.0 - Misiones individuales globales + editor visual
# Los dias son dias REALES, no dias de Minecraft.
# ==========================================================

time-zone: "America/Argentina/Cordoba"

database:
  file: "mdvquest.db"
  flush-interval-seconds: 30
  cleanup-interval-seconds: 60
  busy-timeout-ms: 5000
  incremental-vacuum-pages: 64

performance:
  # No se escanean inventarios ni jugadores periodicamente.
  # El progreso se procesa solamente cuando ocurre un evento relevante.
  progress-actionbar: true
  progress-actionbar-cooldown-ms: 900
  unload-player-cache-on-quit: true

rotations:
  # Cada pool sortea una cantidad global entre min-missions y max-missions.
  # NORMAL: solo definiciones normal.
  # VIP1: definiciones normal + vip1 que no hayan salido antes.
  # VIP2: definiciones vip1 + vip2 que no hayan salido antes.
  daily:
    enabled: true
    duration-days: 1
    pools:
      normal: { min-missions: 5, max-missions: 8 }
      vip1: { min-missions: 2, max-missions: 5 }
      vip2: { min-missions: 1, max-missions: 4 }
    anchor-date: "2026-01-01"
    reset-time: "00:00"
    seed: "mdvquest-daily"

  two-days:
    enabled: true
    duration-days: 2
    pools:
      normal: { min-missions: 3, max-missions: 5 }
      vip1: { min-missions: 1, max-missions: 3 }
      vip2: { min-missions: 1, max-missions: 2 }
    anchor-date: "2026-01-01"
    reset-time: "00:00"
    seed: "mdvquest-two-days"

  three-days:
    enabled: true
    duration-days: 3
    pools:
      normal: { min-missions: 2, max-missions: 4 }
      vip1: { min-missions: 1, max-missions: 3 }
      vip2: { min-missions: 1, max-missions: 2 }
    anchor-date: "2026-01-01"
    reset-time: "00:00"
    seed: "mdvquest-three-days"

  four-days:
    enabled: true
    duration-days: 4
    pools:
      normal: { min-missions: 2, max-missions: 3 }
      vip1: { min-missions: 1, max-missions: 2 }
      vip2: { min-missions: 1, max-missions: 2 }
    anchor-date: "2026-01-01"
    reset-time: "00:00"
    seed: "mdvquest-four-days"

  five-days:
    enabled: true
    duration-days: 5
    pools:
      normal: { min-missions: 1, max-missions: 3 }
      vip1: { min-missions: 1, max-missions: 2 }
      vip2: { min-missions: 1, max-missions: 1 }
    anchor-date: "2026-01-01"
    reset-time: "00:00"
    seed: "mdvquest-five-days"

  six-days:
    enabled: true
    duration-days: 6
    pools:
      normal: { min-missions: 1, max-missions: 3 }
      vip1: { min-missions: 1, max-missions: 2 }
      vip2: { min-missions: 1, max-missions: 1 }
    anchor-date: "2026-01-01"
    reset-time: "00:00"
    seed: "mdvquest-six-days"

  weekly:
    enabled: true
    duration-days: 7
    pools:
      normal: { min-missions: 3, max-missions: 5 }
      vip1: { min-missions: 2, max-missions: 4 }
      vip2: { min-missions: 1, max-missions: 3 }
    anchor-date: "2026-01-05"
    reset-time: "00:00"
    seed: "mdvquest-weekly"

access-tiers:
  # VIP2 puede reclamar también instancias VIP1 aunque LuckPerms no herede el permiso.
  vip2-inherits-vip1: true
  normal:
    display-name: "Normal"
  vip1:
    display-name: "VIP"
    permission: "mdvquest.access.vip1"
    locked-material: LIGHT_BLUE_STAINED_GLASS_PANE
  vip2:
    display-name: "VIP 2"
    permission: "mdvquest.access.vip2"
    locked-material: YELLOW_STAINED_GLASS_PANE

menus:
  # Puede ser URL directa de textures.minecraft.net o Value Base64 de Minecraft-Heads.
  back-head-texture: ""
  # Comando al volver desde el catálogo principal.
  back-command: "social"

  # Compatibilidad con configuraciones 1.0/1.1 antiguas.
  title: "&8Misiones"
  detail-title: "&8Mision: %mission%"

  # Botones de paginación compartidos por ambos menús.
  page-buttons:
    previous:
      material: ARROW
      name: "&ePágina anterior"
      lore:
        - "&7Página actual: &f%page%/%pages%"
    next:
      material: ARROW
      name: "&aPágina siguiente"
      lore:
        - "&7Página actual: &f%page%/%pages%"

  main:
    title: "&8Misiones"
    size: 54
    category-slots: [9, 18, 27, 36]
    mission-slots: [10,11,12,13,14,15,16,17,19,20,21,22,23,24,25,26,28,29,30,31,32,33,34,35,37,38,39,40,41,42,43,44]
    previous-page-slot: 45
    back-slot: 49
    next-page-slot: 53
    selected-category-glow: true

    access:
      # Se muestra a jugadores que pueden progresar la misión, pero todavía no pueden reclamarla.
      locked-line: "&b● Necesitas el rango &f%rank% &bpara reclamar la recompensa de esta misión."

    back-button:
      name: "&eVolver"
      lore:
        - "&7Regresa al menú de /social."

    mission-state:
      completed-material: LIME_WOOL
      claimed-material: GRAY_DYE

    # Textos del lore de cada misión en el catálogo principal.
    mission-lore:
      objectives-header: "&eObjetivos:"
      objective-complete-state: "&a✔ "
      objective-pending-state: "&7• "
      objective-format: "%state%&f%objective% &7(%progress%/%required%)"
      rewards-header: "&eRecompensas:"
      experience-format: "&7• &b%amount% EXP &f%target%"
      vanilla-item-prefix: "&7• &f%amount%x "
      mmoitem-prefix: "&7• &d%amount%x "
      mythic-item-prefix: "&7• &5%amount%x "
      exact-item-prefix: "&7• &f%amount%x "
      invalid-item-format: "&7• &f%amount%x %item%"
      invalid-mmoitem-format: "&7• &d%amount%x %item%"
      invalid-mythic-item-format: "&7• &5%amount%x %item%"
      no-reward: "&7• Sin recompensa configurada"
      expiration: "&7Expira en: &f%remaining%"
      claimed: "&7Recompensa ya reclamada."
      completed: "&a&lClick para recibir la recompensa."
      details: "&eClick para ver más detalles."

    categories:
      one-day:
        material: BOOK
        name: "&eMisiones diarias"
        lore:
          - "&7Completadas: &f%completed%/%total%"
          - "&7Nuevas misiones en: &f%remaining%"
          - ""
          - "&eClick para consultar."
      two-three-days:
        material: BOOK
        name: "&eMisiones de 2 a 3 días"
        lore:
          - "&7Completadas: &f%completed%/%total%"
          - "&7Más misiones en: &f%remaining%"
          - ""
          - "&eClick para consultar."
      four-six-days:
        material: BOOK
        name: "&eMisiones de 4 a 6 días"
        lore:
          - "&7Completadas: &f%completed%/%total%"
          - "&7Más misiones en: &f%remaining%"
          - ""
          - "&eClick para consultar."
      seven-days:
        material: BOOK
        name: "&eMisiones semanales"
        lore:
          - "&7Completadas: &f%completed%/%total%"
          - "&7Nuevas misiones en: &f%remaining%"
          - ""
          - "&eClick para consultar."

  detail:
    title: "&8Misión: %mission%"
    size: 54
    mission-icon-slot: 4
    objective-slots: [10,11,12,13,14,15,16]
    reward-slots: [29,30,31,32,33]
    previous-reward-page-slot: 45
    back-slot: 49
    next-reward-page-slot: 53

    back-button:
      name: "&eVolver"
      lore:
        - "&7Regresa al catálogo anterior."

    objective-state:
      pending-material: PAPER
      delivery-material: CHEST
      completed-material: LIME_DYE

    experience-icon: EXPERIENCE_BOTTLE
    experience-name: "&bExperiencia"

    objective-lore:
      pending-name: "&e%objective%"
      completed-name: "&a%objective%"
      progress: "&7Progreso: &f%progress%&7/&f%required%"
      delivery: "&eClick para entregar objetos."
      completed: "&aObjetivo completado."

    experience-lore:
      - "&7Recibirás &f%amount% EXP"
      - "&7Para: &f%target%"

    reward-item-quantity: "&7Cantidad: &f%amount%"
    empty-reward:
      material: CHEST
      name: "&eRecompensas"
      lore:
        - "&7Recompensa ejecutada por comandos."

    reward-border:
      enabled: true
      material: LIME_STAINED_GLASS_PANE
      name: " "
      # Rectángulo alrededor de los slots 29 al 33.
      slots: [19,20,21,22,23,24,25,28,34,37,38,39,40,41,42,43]

mdvsocial:
  enabled: true
  auto-install-main-button: false
  main-menu-id: "main"
  button-id: "misiones"
  button-slot: 10
  button-material: "COMPASS"
  button-name: "&dMisiones"
  button-lore:
    - "&7Consulta tus encargos activos."
    - "&7El progreso es automatico."
    - "&eClick para abrir."

rewards:
  # Se ejecuta desde consola para experiencia main y de profesiones.
  mmocore-experience-command: "mmocore admin exp give %player% %profession% %amount% false"
  # Nombres visibles de la experiencia. Puedes añadir IDs de profesiones.
  profession-display-names:
    main: "Nivel principal"
    mining: "Minería"
    woodcutting: "Leñador"
    farming: "Agricultura"
    fishing: "Pesca"
    hunting: "Cazador"

safety:
  # Solo modifica missions/examples.yml una vez y reemplaza sus recompensas
  # por EXP principal baja + hierro. No toca tus otros YAML.
  sanitize-example-economy-rewards: true

editor:
  # El editor se abre con /mdvquest admin o /mdvquest crear.
  # Las respuestas guiadas se escriben en chat; "cancelar" vuelve sin aplicar el paso.
  enabled: true
  # Coincide con los siete slots 10 al 16 del menú público de detalle.
  max-objectives-per-mission: 7

anti-exploit:
  placed-blocks:
    enabled: true
    # Solo registra materiales que aparecen en objetivos natural-only.
    persist: true
  pvp:
    require-direct-killer: true
    unique-victims-default: true
    deny-same-ip: true
    minimum-victim-playtime-minutes: 30
    victim-repeat-cooldown-hours: 24
    allowed-worlds: [world]
    # Opcional. Si tienes PlaceholderAPI y un placeholder de ID de clan,
    # puedes impedir contar miembros del mismo clan.
    clan-id-placeholder: ""

messages:
  prefix: "&6&l[&5&lMDVCRAFT&6&l] &4» "
  no-permission: "&cNo tienes permiso."
  no-active-missions: "&7No hay misiones activas en este momento."
  objective-completed: "&aObjetivo completado: &f%objective%"
  mission-completed: "&a&lMision completada: &f%mission% &7Abre &f/misiones &7para reclamarla antes de que expire."
  mission-claimed: "&aRecompensa reclamada: &f%mission%"
  mission-expired: "&cLa mision ya expiro. La recompensa se perdio."
  already-claimed: "&cYa reclamaste esta recompensa."
  inventory-slots-needed: "&cDebes liberar &f%slots% slot(s) &cpara recibir la recompensa completa. Esta recompensa ocupa &f%required% slot(s)&c."
  not-completed: "&cTodavia no completaste todos los objetivos."
  delivery-none: "&cNo tienes objetos validos para entregar."
  delivery-progress: "&aEntregaste &f%amount%&a. Progreso: &f%progress%/%required%"
  reload: "&aMDVQuest recargado."
  forced-rotation: "&aRotacion regenerada: &f%rotation%"
  mission-rank-required: "&cNecesitas el rango &f%rank% &cpara reclamar esta recompensa."
  reroll-warning: "&eEsto borrará el progreso y recompensas pendientes de la rotación &f%rotation%&e. Confirma con: &f%command%"
  reroll-all-warning: "&cEsto regenerará TODAS las rotaciones y borrará todo su progreso/recompensas pendientes. Confirma con: &f%command%"
  reroll-success: "&aReroll completado para la rotación: &f%rotation%"
  reroll-all-success: "&aReroll completado para &f%count% &arotaciones."
